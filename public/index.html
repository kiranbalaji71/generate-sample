<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DocGen Pro | Premium Document Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://unpkg.com/lucide@latest"></script>

    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            fontFamily: {
              sans: ["Inter", "sans-serif"],
              outfit: ["Outfit", "sans-serif"],
            },
            colors: {
              brand: {
                50: "#fee2e2",
                100: "#fecaca",
                200: "#fca5a5",
                300: "#f87171",
                400: "#ef4444",
                500: "#dc2626",
                600: "#b91c1c",
                700: "#991b1b",
                800: "#7f1d1d",
                900: "#450a0a",
              },
            },
          },
        },
      };
    </script>

    <style>
      body {
        font-family: "Inter", sans-serif;
        background: #0a0a0a;
        color: #ffffff;
        min-height: 100vh;
      }

      .glass {
        background: rgba(20, 20, 20, 0.7);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
      }

      .gradient-text {
        background: linear-gradient(
          135deg,
          #dc2626 0%,
          #ef4444 50%,
          #f87171 100%
        );
        background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      .gradient-btn {
        background: linear-gradient(135deg, #dc2626 0%, #b91c1c 100%);
        transition: all 0.3s ease;
      }

      .gradient-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 20px -10px rgba(220, 38, 38, 0.6);
        filter: brightness(1.15);
      }

      .progress-bar-glow {
        box-shadow: 0 0 15px rgba(220, 38, 38, 0.5);
      }

      .blob {
        position: absolute;
        width: 500px;
        height: 500px;
        background: linear-gradient(to right, #450a0a, #7f1d1d);
        filter: blur(80px);
        opacity: 0.08;
        z-index: -1;
        border-radius: 50%;
        animation: move 20s infinite alternate;
      }

      @keyframes move {
        from {
          transform: translate(-10%, -10%);
        }
        to {
          transform: translate(20%, 20%);
        }
      }

      input[type="number"]::-webkit-inner-spin-button,
      input[type="number"]::-webkit-outer-spin-button {
        -webkit-appearance: none;
        margin: 0;
      }

      /* Custom select dropdown styling */
      select {
        color-scheme: dark;
      }

      select option {
        background-color: #1a1a1a;
        color: #ffffff;
        padding: 12px;
      }

      select option:hover,
      select option:checked {
        background: linear-gradient(135deg, #dc2626 0%, #b91c1c 100%);
        color: #ffffff;
      }
    </style>
  </head>
  <body class="flex items-center justify-center p-6 relative overflow-hidden">
    <div class="blob top-0 left-0"></div>
    <div
      class="blob bottom-0 right-0"
      style="
        animation-delay: -5s;
        background: linear-gradient(to right, #7f1d1d, #450a0a);
      "
    ></div>

    <div class="w-full max-w-lg">
      <div
        class="glass rounded-3xl p-8 border border-white/10 relative overflow-hidden"
      >
        <div class="flex items-center gap-4 mb-4">
          <div
            class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-brand-500/10 border border-brand-500/20"
          >
            <i data-lucide="file-plus" class="w-8 h-8 text-brand-400"></i>
          </div>
          <div>
            <h1 class="text-3xl font-outfit font-bold mb-2">
              <span class="text-brand-400">AIDoc Generator</span>
            </h1>
            <p class="text-slate-400 text-sm">
              Sample document data generator by AI
            </p>
          </div>
        </div>

        <div class="space-y-6">
          <div class="space-y-2">
            <label
              for="docType"
              class="text-xs font-semibold uppercase tracking-wider text-slate-500 flex items-center gap-2"
            >
              <i data-lucide="file-text" class="w-3.5 h-3.5"></i>
              Document Type
            </label>
            <div class="relative">
              <select
                id="docType"
                class="w-full bg-slate-900/50 border border-white/5 rounded-xl px-4 py-3.5 appearance-none focus:outline-none focus:ring-2 focus:ring-brand-500/50 transition-all text-slate-200"
              ></select>
              <div
                class="absolute right-4 top-1/2 -translate-y-1/2 pointer-events-none text-slate-500"
              >
                <i data-lucide="chevron-down" class="w-4 h-4"></i>
              </div>
            </div>
          </div>

          <div class="space-y-2">
            <label
              for="sampleCount"
              class="text-xs font-semibold uppercase tracking-wider text-slate-500 flex items-center gap-2"
            >
              <i data-lucide="layers" class="w-3.5 h-3.5"></i>
              Sample Count
            </label>
            <div
              class="flex items-center gap-4 bg-slate-900/50 border border-white/5 rounded-xl p-1"
            >
              <button
                onclick="decrement()"
                class="p-3 text-slate-400 hover:text-white transition-colors"
              >
                <i data-lucide="minus" class="w-4 h-4"></i>
              </button>
              <input
                type="number"
                id="sampleCount"
                value="1"
                min="1"
                max="1000"
                class="grow bg-transparent text-center text-lg font-semibold focus:outline-none text-slate-200"
              />
              <button
                onclick="increment()"
                class="p-3 text-slate-400 hover:text-white transition-colors"
              >
                <i data-lucide="plus" class="w-4 h-4"></i>
              </button>
            </div>
          </div>

          <button
            id="generateBtn"
            onclick="generate()"
            class="gradient-btn w-full rounded-2xl py-4 font-outfit font-bold flex items-center justify-center gap-3 active:scale-[0.98]"
          >
            <i data-lucide="zap" class="w-5 h-5"></i>
            Generate Documents
          </button>

          <div id="progressSection" class="hidden space-y-3 pt-2">
            <div
              class="flex justify-between items-center text-xs text-slate-400 px-1"
            >
              <span id="progressText">Processing batch...</span>
              <span id="progressPercent">0%</span>
            </div>
            <div class="h-2 w-full bg-slate-800 rounded-full overflow-hidden">
              <div
                id="progressBar"
                class="h-full bg-gradient-to-r from-brand-500 to-brand-600 transition-all duration-300 ease-out progress-bar-glow"
                style="width: 0%"
              ></div>
            </div>
          </div>

          <div
            id="status"
            class="hidden rounded-xl bg-emerald-500/5 border border-emerald-500/10 p-4 animate-in fade-in slide-in-from-bottom-2 duration-300"
          >
            <div class="flex items-center gap-3">
              <i
                data-lucide="check-circle-2"
                class="w-5 h-5 text-emerald-400"
              ></i>
              <p
                id="statusMsg"
                class="text-sm text-emerald-400 font-medium"
              ></p>
            </div>
          </div>
        </div>

        <div
          class="mt-10 pt-6 border-t border-white/5 flex items-center justify-between opacity-40"
        >
          <span class="text-[10px] uppercase tracking-[0.2em]">
            © Copyright 2025
          </span>
          <div class="flex gap-4">
            <i data-lucide="shield-check" class="w-3 h-3"></i>
            <i data-lucide="cpu" class="w-3 h-3"></i>
            <i data-lucide="database" class="w-3 h-3"></i>
          </div>
        </div>
      </div>
    </div>

    <script>
      lucide.createIcons();

      function increment() {
        const input = document.getElementById("sampleCount");
        input.value = parseInt(input.value) + 1;
      }

      function decrement() {
        const input = document.getElementById("sampleCount");
        if (parseInt(input.value) > 1) {
          input.value = parseInt(input.value) - 1;
        }
      }

      async function loadOptions() {
        try {
          const res = await fetch("/options?" + new Date().getTime());
          const options = await res.json();
          const select = document.getElementById("docType");
          select.innerHTML = options
            .map((opt) => `<option value="${opt.value}">${opt.label}</option>`)
            .join("");
          lucide.createIcons();
        } catch (err) {
          console.error("Failed to load options");
        }
      }

      async function generate() {
        const type = document.getElementById("docType").value;
        const sample = document.getElementById("sampleCount").value;
        const progressSection = document.getElementById("progressSection");
        const progressBar = document.getElementById("progressBar");
        const progressPercent = document.getElementById("progressPercent");
        const progressText = document.getElementById("progressText");
        const status = document.getElementById("status");
        const statusMsg = document.getElementById("statusMsg");
        const generateBtn = document.getElementById("generateBtn");

        status.classList.add("hidden");
        progressSection.classList.remove("hidden");
        generateBtn.disabled = true;
        generateBtn.classList.add("opacity-50", "cursor-not-allowed");

        progressBar.style.width = "0%";
        progressPercent.innerText = "0%";
        progressText.innerText = "Generating snapshots...";

        let progressValue = 0;
        const interval = setInterval(() => {
          progressValue = Math.min(progressValue + Math.random() * 8, 92);
          progressBar.style.width = progressValue + "%";
          progressPercent.innerText = Math.floor(progressValue) + "%";
        }, 300);

        try {
          const res = await fetch("/generate", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ type, sample }),
          });

          if (!res.ok) throw new Error("Failed request");

          const blob = await res.blob();
          clearInterval(interval);

          progressBar.style.width = "100%";
          progressPercent.innerText = "100%";
          progressText.innerText = "Finalizing archive...";

          const url = window.URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url;
          a.download = `${type}_batch_${new Date().getTime()}.zip`;
          document.body.appendChild(a);
          a.click();
          a.remove();
          window.URL.revokeObjectURL(url);

          setTimeout(() => {
            progressSection.classList.add("hidden");
            status.classList.remove("hidden");
            statusMsg.innerText = `Archived ${sample} documents successfully.`;
            generateBtn.disabled = false;
            generateBtn.classList.remove("opacity-50", "cursor-not-allowed");
          }, 800);
        } catch (error) {
          clearInterval(interval);
          progressSection.classList.add("hidden");
          status.classList.remove("hidden");
          status.classList.replace("bg-emerald-500/5", "bg-rose-500/5");
          status.classList.replace(
            "border-emerald-500/10",
            "border-rose-500/10"
          );
          statusMsg.classList.replace("text-emerald-400", "text-rose-400");
          statusMsg.innerText = "Critical error during generation. Check logs.";
          generateBtn.disabled = false;
          generateBtn.classList.remove("opacity-50", "cursor-not-allowed");
        }
      }

      window.onload = loadOptions;
    </script>
  </body>
</html>
